<style id="appStyles">

.brand{display:flex;align-items:center;gap:10px;min-width:0}.brand-mark{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#17191d,#363a43);color:#fff;display:grid;place-items:center;flex:none;box-shadow:var(--shadow1)}.brand-mark svg{width:18px}.brand strong{display:block;font-size:14px}.brand span{display:block;color:var(--muted);font-size:9px;white-space:nowrap}

<div class="app" id="app">
<header class="topbar">

  <div class="top-actions">

function setupImports(){
  var box=$("#editorTools");box.innerHTML='<div style="display:flex;gap:5px"><label class="btn soft upload" title="Import JSON">'+ICON.link+'Import<input id="importJson" type="file" accept="application/json"></label><button class="icon-btn" id="exportJson" type="button" title="Export JSON" aria-label="Export JSON">'+ICON.external+'</button></div>';
  $("#exportJson").onclick=exportJson;$("#importJson").onchange=function(e){var f=e.target.files&&e.target.files[0];if(!f)return;f.text().then(function(txt){var x=JSON.parse(txt);if(!x.personal||!x.design||!Array.isArray(x.sectionOrder))throw new Error("Invalid portfolio data");pushHistory(state);state=Object.assign(clone(demo),x,{personal:Object.assign(clone(demo.personal),x.personal||{}),social:Object.assign(clone(demo.social),x.social||{}),contact:Object.assign(clone(demo.contact),x.contact||{}),design:Object.assign(clone(demo.design),x.design||{})});state.skills=Array.isArray(x.skills)?x.skills:[];state.projects=Array.isArray(x.projects)?x.projects:[];state.experience=Array.isArray(x.experience)?x.experience:[];state.education=Array.isArray(x.education)?x.education:[];renderAll();toast("Portfolio data imported")}).catch(function(){toast("Import failed","error")});e.target.value=""}
}
function setupDivider(){
  var d=$("#divider"),move=function(e){if(!move.active)return;editorWidth=Math.min(560,Math.max(300,e.clientX));document.documentElement.style.setProperty("--editor-width",editorWidth+"px")};
  d.onpointerdown=function(e){if(window.innerWidth<=800)return;move.active=true;d.classList.add("dragging");d.setPointerCapture?.(e.pointerId)};d.onpointermove=move;d.onpointerup=function(){move.active=false;d.classList.remove("dragging")};d.onpointercancel=function(){move.active=false;d.classList.remove("dragging")}
}
function start(){setupTop();setupImports();setupDivider();renderEditor();updateProgress();historyButtons();schedulePreview();setTimeout(function(){$("#app").classList.add("ready")},30)}
start();
})();
</script>
