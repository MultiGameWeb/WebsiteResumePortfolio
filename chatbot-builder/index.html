<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f8fc">
  <meta name="description" content="BotCraft — build your business chatbot with a guided conversation.">
  <title>BotCraft · Chatbot Builder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Noto+Sans+Telugu:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>if(new URLSearchParams(location.search).get("embed") === "1") document.documentElement.classList.add("botcraft-embedded");</script>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main id="botcraftApp" class="botcraft-app" aria-label="BotCraft business chatbot builder">
    <header id="progressHeader" class="app-header"></header>
    <section class="botcraft-auth-card" aria-labelledby="botcraftAuthHeading">
      <div>
        <h2 id="botcraftAuthHeading">Secure sign-in</h2>
        <p id="botcraftAuthStatus" role="status" aria-live="polite">Checking Google sign-in configuration…</p>
      </div>
      <div id="botcraftGoogleButton" class="botcraft-google-button"></div>
    </section>
    <div class="connection-notice" role="status">BotCraft sends owner data only to its configured protected Worker. Live use requires Google OAuth and Worker configuration.</div>
    <div id="businessWorkspace"></div>
    <section class="conversation-shell" aria-label="Chat with BotCraft">
      <div id="messageList" class="message-list" role="log" aria-live="polite" aria-relevant="additions text"></div>
      <button id="scrollToBottom" class="scroll-bottom-button" type="button" aria-label="Scroll to latest message" hidden>
        <span aria-hidden="true">↓</span><span>New messages</span>
      </button>
      <div id="dropOverlay" class="drop-overlay" aria-hidden="true">
        <div class="drop-overlay-card"><span class="drop-icon" aria-hidden="true">＋</span><strong>Drop files to attach</strong><span>Images, PDFs and documents up to 10 MB each</span></div>
      </div>
    </section>
    <div id="inputBar"></div>
    <div id="toastRegion" class="sr-only" aria-live="polite" aria-atomic="true"></div>
  </main>
  <dialog id="imageLightbox" class="image-lightbox" aria-label="Image preview"></dialog>
  <script src="./botcraft-config.js"></script>
  <script src="./google-auth.js"></script>
  <script type="module" src="./business-workspace-panel.js"></script>
  <script type="module" src="./chat-screen.js"></script>
</body>
</html>
