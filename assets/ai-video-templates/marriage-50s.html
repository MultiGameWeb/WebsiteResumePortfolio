:root{
  --maroon:#4a0a16;
  --maroon-deep:#24040c;
  --gold:#e6c47c;
  --gold-deep:#c39a3f;
  --cream:#fff7e8;
  --surface:#180207;
}

@media (prefers-color-scheme: dark){
  :root{
    --surface:#100103;
  }
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  background:var(--surface);
}

body{
  font-family:'Manrope',system-ui,sans-serif;
  color:var(--cream);
}

.font-display{
  font-family:'Cormorant Garamond',Georgia,serif;
}

.gold-text{
  background:linear-gradient(100deg,#fff0b8 0%,#e6c47c 38%,#a87c22 58%,#ffeeb2 82%);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}

.hairline{
  height:1px;
  background:linear-gradient(90deg,transparent,#e6c47c,transparent);
}

@keyframes kenburns{
  from{
    transform:scale(1) translateY(0);
  }

  to{
    transform:scale(1.14) translateY(-1.5%);
  }
}

@keyframes petalFall{
  0%{
    transform:translate3d(0,-12vh,0) rotate(0deg);
    opacity:0;
  }

  8%{
    opacity:.92;
  }

  50%{
    transform:translate3d(18px,48vh,0) rotate(180deg);
  }

  92%{
    opacity:.75;
  }

  100%{
    transform:translate3d(-14px,108vh,0) rotate(340deg);
    opacity:0;
  }
}

@keyframes sway{
  0%,100%{
    transform:translateX(0) rotate(-4deg);
  }

  50%{
    transform:translateX(3px) rotate(4deg);
  }
}

@keyframes glowPulse{
  0%,100%{
    opacity:.55;
    transform:scale(1);
  }

  50%{
    opacity:.9;
    transform:scale(1.04);
  }
}

@keyframes riseIn{
  from{
    opacity:0;
    transform:translateY(14px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }
}

.petal{
  position:absolute;
  top:0;
  border-radius:100% 4px 100% 4px;
  background:linear-gradient(135deg,#ffd8a8,#f07f9a 65%,#e6c47c);
  box-shadow:0 0 10px rgba(255,205,150,.35);
  animation-name:petalFall;
  animation-timing-function:linear;
  animation-iteration-count:infinite;
  pointer-events:none;
}

.kenburns{
  animation:kenburns 10s ease-out forwards;
}

  --tw-bg-opacity: 1;
  background-color: rgb(255 224 138 / var(--tw-bg-opacity, 1));
}

.hover\:bg-black\/50:hover {
  background-color: rgb(0 0 0 / 0.5);
}

.focus\:outline-none:focus {
  outline: 2px solid transparent;
  outline-offset: 2px;
}

.focus\:ring-2:focus {
  --tw-ring-offset-shadow: var(--tw-ring-inset) 0 0 0 var(--tw-ring-offset-width) var(--tw-ring-offset-color);

}
