:root {
  --bg: #0a0a0a;
  --surface: #111111;
  --text: #ffffff;
  --muted: #b8b4b0;
  --accent: #ff4c29;
  --line: rgba(255,255,255,.18);
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg:#050505;
    --surface:#111111;
    --text:#fff;
    --muted:#b8b4b0;
  }
}

* {
  box-sizing: border-box;
}

html, body, #root {
  margin:0;
  min-height:100%;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: Impact, "Arial Narrow", "Franklin Gothic Medium", sans-serif;
  overflow-x: clip;
}

button {
  font: inherit;
}

.page-shell {
  min-height: 100vh;
  width: 100%;
  padding: var(--safe-area-inset-top) 18px 28px;
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 450px) minmax(0, .35fr);
  align-items: center;
  justify-items: center;
  gap: 28px;
  background: radial-gradient(circle at 15% 10%, rgba(255,76,41,.18), transparent 32%), radial-gradient(circle at 88% 90%, rgba(255,76,41,.12), transparent 28%), #0a0a0a;
}

.backdrop-copy {
  width: min(100%, 380px);
  justify-self: end;
}

.backdrop-copy > p:first-child {
  color: var(--accent);
  letter-spacing: .18em;
  font: 700 12px/1.4 Arial, sans-serif;
}

.backdrop-copy > p:first-child span {
  font-size: 9px;
}

.backdrop-copy h1 {
  font-size: clamp(48px, 5vw, 74px);
  line-height: .86;
  letter-spacing: -.04em;
  margin: 18px 0;
  font-weight: 900;
  text-transform: uppercase;
}

.backdrop-copy .small {
  color: var(--muted);
  font: 400 16px/1.6 Arial, sans-serif;
}

.phone {
  width: min(100%, 450px);
  aspect-ratio: 9 / 16;
  max-height: calc(100vh - var(--safe-area-inset-top) - 42px);
  background: #000;
  border: 1px solid #343434;
  border-radius: 28px;
  overflow: hidden;
  position: relative;
  box-shadow: 0 32px 90px rgba(0,0,0,.8), 0 0 0 9px #171717, 0 0 0 10px #2c2c2c;
}

.stage {
  position: relative;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
}

.scene {
  position: absolute;
  inset: 0;
  opacity: 0;
  transition: opacity .3s ease;
}

.scene.active {
  opacity: 1;
  z-index: 1;
}

.scene img {
  width: 100%;
  height: 100%;
  -o-object-fit: cover;
     object-fit: cover;
  display: block;
}

.scene.active img {
  animation: kenburns 8s linear both;
}

@keyframes kenburns {
  from {
    transform: scale(1.02) translate(0,0);
  }

  to {
    transform: scale(1.16) translate(-1.2%, -1.2%);
  }
}

.gradient {
  position:absolute;
  inset:0;
  z-index:2;
  pointer-events:none;
  background: linear-gradient(to bottom, rgba(0,0,0,.68) 0%, rgba(0,0,0,.05) 28%, rgba(0,0,0,.18) 54%, rgba(0,0,0,.92) 100%), linear-gradient(90deg, rgba(0,0,0,.32), transparent 32%);
}

.flash {
  position:absolute;
  inset:0;
  z-index:10;
  pointer-events:none;
  background:#fff;
  animation: flash .55s ease-out both;
}

@keyframes flash {
  0%{
    opacity:.92
  }

  100%{
    opacity:0
  }
}

.topbar {
  position:absolute;
  z-index:4;
  top:0;
  left:0;
  right:0;
  padding: 16px 16px 10px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  color:white;
}

.brand {
  display:flex;
  align-items:center;
  gap:7px;
  font: 800 11px/1 Arial, sans-serif;
  letter-spacing:.12em;
}

.brand span {
  display:grid;
  place-items:center;
  width:26px;
  height:26px;
  border-radius:50%;
  background:var(--accent);
  color:#fff;
  font-size:10px;
  box-shadow:0 0 18px rgba(255,76,41,.8);
}

.timer {
  font-family: Arial, sans-serif;
  font-size: 13px;
}

.timer b {
  font-variant-numeric: tabular-nums;
}

.timer i {
  font-style:normal;
  color:#b9b9b9;
  margin-left:3px;
  font-size:11px;
}

.scene-count {
  font: 800 10px/1 Arial, sans-serif;
  letter-spacing:.1em;
}

.scene-count b {
  color: var(--accent);
}

.corner {
  position:absolute;
  z-index:3;
  width:23px;
  height:23px;
  border:2px solid rgba(255,255,255,.65);
}

.corner-a {
  top: 64px;
  left:16px;
  border-right:0;
  border-bottom:0;
}

.corner-b {
  top: 64px;
  right:16px;
  border-left:0;
  border-bottom:0;
}

.copy {
  position:absolute;
  z-index:5;
  left:22px;
  right:22px;
  bottom: 169px;
  color:white;
  animation: fadeUp .8s cubic-bezier(.2,.8,.2,1) both;
}

@keyframes fadeUp {
  from {
    opacity:0;
    transform: translateY(28px);
  }

  to {
    opacity:1;
    transform: translateY(0);
  }
}

.eyebrow {
  display:flex;
  align-items:center;
  gap:8px;
  color: var(--accent);
  font: 800 11px/1.2 Arial, sans-serif;
  letter-spacing:.14em;
  text-transform:uppercase;
}

.eyebrow svg {
  filter: drop-shadow(0 0 6px var(--accent));
}

.copy h2 {
  margin: 14px 0 8px;
  font-size: clamp(58px, 15vw, 78px);
  line-height:.82;
  letter-spacing:-.055em;
  font-weight:900;
  text-transform:uppercase;
  text-shadow: 0 5px 28px rgba(0,0,0,.8);
}

.copy h2 em {
  font-style:normal;
  color: var(--accent);
  text-shadow: 0 0 22px rgba(255,76,41,.75), 0 4px 20px rgba(0,0,0,.6);
}

.copy > p {
  margin:0;
  font: 700 16px/1.3 Arial, sans-serif;
  color:#f7f7f7;
  text-shadow: 0 2px 10px #000;
}

.cta {
  margin-top: 18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  width: 250px;
  max-width:100%;
  background:var(--accent);
  color:#fff;
  padding: 15px 16px;
  font: 900 14px/1 Arial, sans-serif;
  letter-spacing:.05em;
  border-radius:3px;
  box-shadow:0 0 30px rgba(255,76,41,.55);
}

.cta span {
  font-size:22px;
}

.bottom {
  position:absolute;
  z-index:6;
  left:0;
  right:0;
  bottom:0;
  padding: 18px 17px 16px;
}

.segments {
  display:flex;
  gap:5px;
  margin-bottom: 16px;
}

.segment {
  flex:1;
  height:4px;
  background:rgba(255,255,255,.28);
  border:0;
  padding:0;
  cursor:pointer;
  overflow:hidden;
  border-radius:99px;
}

.segment span {
  display:block;
  height:100%;
  background:var(--accent);
  box-shadow:0 0 10px var(--accent);
}

.controls {
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
}

.controls button {
  width:42px;
  height:42px;
  border:1px solid rgba(255,255,255,.28);
  border-radius:50%;
  background:rgba(0,0,0,.48);
  color:#fff;
  display:grid;
  place-items:center;
  cursor:pointer;
  backdrop-filter: blur(8px);
}

.controls button:hover, .controls button:focus-visible {
  border-color:var(--accent);
  color:var(--accent);
  outline:none;
}

.controls .play {
  width:57px;
  height:57px;
  background:var(--accent);
  border-color:var(--accent);
  box-shadow:0 0 28px rgba(255,76,41,.6);
}

.controls .play:hover {
  color:white;
}

.dots {
  display:flex;
  justify-content:center;
  gap:8px;
  margin: 15px 0 9px;
}

.dot {
  width:7px;
  height:7px;
  border-radius:99px;
  border:0;
  background:rgba(255,255,255,.35);
  padding:0;
  cursor:pointer;
}

.dot.on {
  width:24px;
  background:var(--accent);
  box-shadow:0 0 10px var(--accent);
}

.loop-note {
  text-align:center;
  font: 800 9px/1 Arial, sans-serif;
  letter-spacing:.16em;
  color:rgba(255,255,255,.62);
}

.meta {
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  gap:12px;
  justify-self:start;
  font: 800 11px/1 Arial, sans-serif;
  letter-spacing:.16em;
  color:#8f8b88;
}

.meta i {
  display:block;
  width:34px;
  height:1px;
  background:#3b3b3b;
}

@media (max-width: 850px) {
  .page-shell {
    grid-template-columns: 1fr;
    gap: 0;
    padding-left: 10px;
    padding-right: 10px;
    padding-bottom: 16px;
    align-items:start;
  }

  .backdrop-copy, .meta {
    display:none;
  }

  .phone {
    max-height: calc(100vh - var(--safe-area-inset-top) - 18px);
    border-radius: 24px;
  }
}

@media (max-width: 390px) {
  .page-shell {
    padding-left: 8px;
    padding-right: 8px;
  }

  .phone {
    border-radius: 20px;
    box-shadow: 0 20px 50px rgba(0,0,0,.75), 0 0 0 5px #171717;
  }

  .copy {
    bottom: 160px;
    left:18px;
    right:18px;
  }

  .copy h2 {
    font-size: 62px;
  }

  .topbar {
    padding-left: 12px;
    padding-right: 12px;
  }

  .bottom {
    padding-left: 12px;
    padding-right: 12px;
  }
}
