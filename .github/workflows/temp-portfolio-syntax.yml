name: temp-portfolio-syntax
on:
  push:
    branches: [main]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract and check portfolio script
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('portfolio-creator.html').read_text()
          a=s.rfind('\n<script>')
          b=s.rfind('\n</script>')
          Path('/tmp/portfolio.js').write_text(s[a+9:b])
          print('script chars', len(s[a+9:b]))
          PY
          node --check /tmp/portfolio.js
