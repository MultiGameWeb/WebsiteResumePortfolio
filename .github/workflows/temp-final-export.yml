name: temp-final-export
on:
  push:
    branches: [main]
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: sitecraft-final
          path: |
            index.html
            templates.html
            ai-websites.html
            portfolio-creator.html
            resume-builder.html
