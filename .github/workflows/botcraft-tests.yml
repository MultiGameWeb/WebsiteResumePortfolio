name: BotCraft Core Tests

on:
  push:
    branches:
      - "fix/botcraft-*"
      - "feat/botcraft-*"
      - "ci/botcraft-*"
  pull_request:
    paths:
      - "server/chatbot-builder/**"
      - "chatbot-builder/**"
      - ".github/workflows/botcraft-tests.yml"

permissions:
  contents: read

jobs:
  test:
    name: Typecheck and unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/chatbot-builder
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test

      - name: Browser JavaScript syntax checks
        working-directory: .
        run: |
          node --check chatbot-builder/api-client.js
          node --check chatbot-builder/business-api.js
          node --check chatbot-builder/business-workspace-panel.js
          node --check chatbot-builder/botcraft-config.js
          node --check chatbot-builder/google-auth.js
          node --check chatbot-builder/chat-screen.js
          node --check chatbot-builder/components.js

      - name: Browser API adapter tests
        working-directory: .
        run: node --test chatbot-builder/api-client.test.mjs chatbot-builder/business-api.test.mjs
