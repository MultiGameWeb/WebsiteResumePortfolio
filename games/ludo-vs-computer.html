<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101821">
<title>Ludo vs Computer | SiteCraft Games</title>
<style>
:root{color-scheme:dark;--bg:#101821;--panel:#1a2631;--line:#334556;--text:#f5f8ff;--muted:#a9b7c5;--red:#e44759;--yellow:#f4c342}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:radial-gradient(ellipse at 50% -12%,#294051 0,transparent 52%),var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;overscroll-behavior:none}
button{font:inherit;touch-action:manipulation}
#app{height:100dvh;width:100%;max-width:980px;margin:auto;padding:clamp(6px,1.2vh,13px) 12px;display:flex;flex-direction:column;align-items:center;gap:6px;overflow:hidden}
header{width:100%;display:flex;align-items:center;justify-content:space-between;gap:9px;flex:0 0 auto}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:42px;height:42px;display:grid;place-items:center;border-radius:14px;background:linear-gradient(145deg,#cf5261,#edaa46);font-size:24px;box-shadow:0 8px 24px #e46b4c33;border:1px solid #ffdb9c44}
h1{margin:0;font-size:clamp(19px,3.5vw,28px);letter-spacing:-.045em}
.sub{margin-top:3px;color:var(--muted);font-size:10px}
.btn,.diff{min-height:36px;padding:0 13px;border:1px solid var(--line);border-radius:11px;background:#ffffff09;color:#eaf2ff;font-size:11px;font-weight:850;cursor:pointer}
.btn.primary{border-color:#ffbc7855;background:linear-gradient(115deg,#df465b,#e49c35);color:#fff;box-shadow:0 7px 20px #d86a3c33}
.btn:disabled{opacity:.43;cursor:not-allowed}
.difficulty{display:flex;align-items:center;justify-content:center;gap:7px;flex:0 0 auto}
.difficulty span{color:var(--muted);font-size:9px;font-weight:900;letter-spacing:.12em}
.diff{min-height:30px;padding:0 14px;border-radius:999px;background:#ffffff08}
.diff[aria-pressed=true]{border-color:#f1c66b;background:#eabf5a20;color:#ffe4a0;box-shadow:inset 0 0 0 1px #eabf5a1c}
.scorebar{width:min(100%,650px);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:9px;flex:0 0 auto}
.player{display:flex;align-items:center;gap:9px;min-width:0;padding:8px 11px;border:1px solid var(--line);border-radius:14px;background:linear-gradient(145deg,#ffffff0d,#ffffff04);box-shadow:0 5px 18px #0002}
.player.cpu{justify-content:flex-end;text-align:right}
.dot{width:17px;height:17px;flex:none;border-radius:50%;background:radial-gradient(circle at 32% 28%,#ffb9b9,#e44759 58%,#9c263b);box-shadow:0 0 0 4px #e4475922,0 2px 5px #0004}
.dot.yellow{background:radial-gradient(circle at 32% 28%,#fff1b5,#f4c342 58%,#ad7915);box-shadow:0 0 0 4px #f4c34222,0 2px 5px #0004}
.player b{display:block;font-size:11px;font-weight:900}.player small{display:block;color:var(--muted);font-size:9px;margin-top:3px}
.score-wrap{display:grid;justify-items:center;gap:1px;min-width:58px}
.score-label{color:var(--muted);font-size:8px;font-weight:900;letter-spacing:.1em}
.score{font-size:20px;font-weight:950;color:#f4d88e;font-variant-numeric:tabular-nums}
.status{width:min(100%,680px);min-height:30px;padding:6px 11px;border:1px solid #ffffff12;border-radius:999px;background:#ffffff08;color:#f4e9d6;text-align:center;font-size:11px;font-weight:850;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.status:before{content:"";width:7px;height:7px;margin-right:8px;border-radius:50%;background:#f6c978;box-shadow:0 0 9px #f6c978aa}
.board-wrap{flex:1 1 auto;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;padding:2px 0}
#board{display:block;width:min(94vw,min(650px,calc(100dvh - 265px)));height:auto;max-height:100%;aspect-ratio:1;filter:drop-shadow(0 17px 30px #0008);touch-action:manipulation}
.controls{width:min(100%,470px);display:flex;align-items:center;justify-content:center;gap:15px;flex:0 0 auto}
.dice-panel{display:flex;align-items:center;gap:10px;padding:5px 12px 5px 6px;border:1px solid #7d8b9d44;border-radius:17px;background:linear-gradient(145deg,#ffffff12,#ffffff05);min-width:124px}
.dice{position:relative;width:61px;height:61px;flex:none;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:3px;padding:9px;border:1px solid #ffffff;border-radius:16px;background:linear-gradient(145deg,#fffef4,#e7e5d9 68%,#c6c9ca);box-shadow:inset 0 2px 2px #fff,0 5px 0 #9aa0a5,0 8px 15px #0005;transition:filter .15s}
.dice:before{content:"";position:absolute;inset:3px;border:1px solid #d8d7ca;border-radius:12px;pointer-events:none}
.dice .pip{width:8px;height:8px;place-self:center;border-radius:50%;background:radial-gradient(circle at 30% 25%,#435367,#121a26 72%);opacity:0;box-shadow:inset 0 1px 1px #0005}
.dice .question{position:absolute;inset:0;display:grid;place-items:center;color:#657184;font-size:28px;font-weight:950;text-shadow:0 1px #fff}
.dice[data-value="1"] .pip:nth-child(6),
.dice[data-value="2"] .pip:nth-child(2),.dice[data-value="2"] .pip:nth-child(10),
.dice[data-value="3"] .pip:nth-child(2),.dice[data-value="3"] .pip:nth-child(6),.dice[data-value="3"] .pip:nth-child(10),
.dice[data-value="4"] .pip:nth-child(2),.dice[data-value="4"] .pip:nth-child(4),.dice[data-value="4"] .pip:nth-child(8),.dice[data-value="4"] .pip:nth-child(10),
.dice[data-value="5"] .pip:nth-child(2),.dice[data-value="5"] .pip:nth-child(4),.dice[data-value="5"] .pip:nth-child(6),.dice[data-value="5"] .pip:nth-child(8),.dice[data-value="5"] .pip:nth-child(10),
.dice[data-value="6"] .pip:nth-child(2),.dice[data-value="6"] .pip:nth-child(4),.dice[data-value="6"] .pip:nth-child(5),.dice[data-value="6"] .pip:nth-child(7),.dice[data-value="6"] .pip:nth-child(8),.dice[data-value="6"] .pip:nth-child(10){opacity:1}
.dice[data-value="0"] .question{display:grid}.dice:not([data-value="0"]) .question{display:none}
.dice.rolling{animation:diceTumble .5s cubic-bezier(.2,.7,.2,1)}
@keyframes diceTumble{0%{transform:rotate(0) translateY(0) scale(1)}25%{transform:rotate(100deg) translateY(-8px) scale(1.08)}55%{transform:rotate(230deg) translateY(1px) scale(.94)}100%{transform:rotate(360deg) translateY(0) scale(1)}}
.dice-caption{display:grid;gap:2px}.dice-caption strong{color:#fff5df;font-size:10px;letter-spacing:.08em}.dice-caption small{color:var(--muted);font-size:8px;font-weight:800}
.roll-btn{min-width:166px;min-height:66px;padding:0 19px;border:1px solid #ffce8966;border-radius:16px;background:linear-gradient(115deg,#d9485b,#ed9a37);color:#fff;box-shadow:0 8px 22px #d86a3c3b,inset 0 1px #ffffff66;font-size:14px;font-weight:950;letter-spacing:.035em;cursor:pointer}
.roll-btn:active:not(:disabled){transform:translateY(2px) scale(.98)}.roll-btn:disabled{opacity:.48;cursor:not-allowed;filter:saturate(.5);box-shadow:none}
.hint{min-height:16px;color:#96a8b8;font-size:9px;text-align:center;flex:0 0 auto}
#board .token{cursor:pointer;transition:filter .12s}#board .token.available{animation:tokenPulse 1.1s ease-in-out infinite alternate}
#board .token.available circle:first-child{stroke:#fff5a8;stroke-width:4}#board .token.selected circle:first-child{stroke:#fff;stroke-width:5;filter:drop-shadow(0 0 7px #fff)}
#board .token text{pointer-events:none;font-family:Inter,system-ui,sans-serif;font-size:13px;font-weight:950;fill:#151821}
@keyframes tokenPulse{from{filter:drop-shadow(0 0 1px #fff3)}to{filter:drop-shadow(0 0 8px #fff9)}}
@media(max-height:650px){#app{gap:3px;padding:4px 7px}.logo{width:34px;height:34px}.difficulty{gap:4px}.diff{min-height:25px;padding:0 9px}.player{padding:4px 7px}.status{min-height:24px;font-size:9px}#board{width:min(91vw,min(540px,calc(100dvh - 235px)))}.dice{width:49px;height:49px;padding:7px;border-radius:13px}.dice .pip{width:7px;height:7px}.roll-btn{min-height:53px;min-width:142px;font-size:12px}.dice-panel{min-width:110px;gap:7px}.btn{min-height:28px}}
@media(max-width:420px){.sub{font-size:8px}.player{gap:6px;padding:6px 7px}.player b{font-size:9px}.player small{font-size:8px}.score{font-size:17px}.difficulty{gap:4px}.difficulty span{font-size:8px}.diff{padding:0 10px;font-size:9px}.controls{gap:8px}.dice-panel{min-width:96px;padding:4px 8px 4px 4px}.dice-caption strong{font-size:8px}.dice-caption small{font-size:7px}.roll-btn{min-width:133px;padding:0 12px}}
@media(max-height:540px){#app{gap:2px;padding:3px 6px}.board-wrap{padding:0}#board{width:min(88vw,min(460px,calc(100dvh - 190px)))}.controls{gap:7px}.dice{width:42px;height:42px;padding:6px}.dice .pip{width:6px;height:6px}.roll-btn{min-height:44px;min-width:122px}.hint{font-size:8px}.player{padding:3px 5px}}

</style>
</head>
<body>
<div id="app">
 <header><div class="brand"><div class="logo" aria-hidden="true">🎲</div><div><h1>Ludo vs Computer</h1><div class="sub">Race all four tokens to the centre</div></div></div><button class="btn" id="newBtn" type="button">↻ New Game</button></header>
 <div class="difficulty"><span>COMPUTER</span><button class="diff" data-level="easy" aria-pressed="false" type="button">Easy</button><button class="diff" data-level="medium" aria-pressed="true" type="button">Medium</button><button class="diff" data-level="hard" aria-pressed="false" type="button">Hard</button></div>
 <section class="scorebar"><div class="player"><span class="dot"></span><div><b>You · Red</b><small id="redHome">0 / 4 home</small></div></div><div class="score" id="score">0 – 0</div><div class="player cpu"><div><b>Computer · Yellow</b><small id="yellowHome">0 / 4 home</small></div><span class="dot yellow"></span></div></section>
 <div class="status" id="status" aria-live="polite">Your turn. Roll a 6 to bring a token out.</div>
 <main class="board-wrap"><svg id="board" viewBox="0 0 600 600" role="img" aria-label="Ludo board. You are red at bottom-left; computer is yellow at top-right."></svg></main>
 <div class="controls">
  <div class="dice-panel"><div class="dice" id="dice" data-value="0" aria-label="Dice ready"><span class="question">?</span><i class="pip"></i><i class="pip"></i><i class="pip"></i><i class="pip"></i><i class="pip"></i><i class="pip"></i><i class="pip"></i><i class="pip"></i><i class="pip"></i></div><div class="dice-caption"><strong id="diceReadout">READY</strong><small>LAST ROLL</small></div></div>
  <button class="roll-btn" id="rollBtn" type="button">🎲 ROLL DICE</button>
 </div>
 <div class="hint" id="hint">Roll the dice, then choose one of your highlighted tokens.</div>
</div>
<script>
(function(){
'use strict';
const NS='http://www.w3.org/2000/svg';
const path=[[6,1],[6,2],[6,3],[6,4],[6,5],[5,6],[4,6],[3,6],[2,6],[1,6],[0,6],[0,7],[0,8],[1,8],[2,8],[3,8],[4,8],[5,8],[6,9],[6,10],[6,11],[6,12],[6,13],[6,14],[7,14],[8,14],[8,13],[8,12],[8,11],[8,10],[8,9],[9,8],[10,8],[11,8],[12,8],[13,8],[14,8],[14,7],[14,6],[13,6],[12,6],[11,6],[10,6],[9,6],[8,5],[8,4],[8,3],[8,2],[8,1],[8,0],[7,0],[6,0]];
const safe=new Set([0,8,13,21,26,34,39,47]);
const homeLane={red:[[7,1],[7,2],[7,3],[7,4],[7,5]],yellow:[[7,13],[7,12],[7,11],[7,10],[7,9]]};
const yard={red:[[9,2],[9,5],[12,2],[12,5]],yellow:[[2,9],[2,12],[5,9],[5,12]]};
const sideInfo={red:{start:0,color:'#e44759',dark:'#9c263b',light:'#ff9ba4'},yellow:{start:26,color:'#f4c342',dark:'#ad7915',light:'#ffe59a'}};
const board=document.getElementById('board'),statusEl=document.getElementById('status'),rollBtn=document.getElementById('rollBtn'),diceEl=document.getElementById('dice');
let tokens,turn,dice,legal,phase,difficulty='medium',sixStreak,selected=-1,timer=0,diceAnimationTimer=0,finished=false,lastAction='';
function el(name,attrs={},parent=board){const n=document.createElementNS(NS,name);for(const [k,v] of Object.entries(attrs))n.setAttribute(k,String(v));parent.appendChild(n);return n;}
function rectCell(r,c,fill,stroke='#c4b8a7'){el('rect',{x:c*40+1.5,y:r*40+1.5,width:37,height:37,rx:5,fill,stroke,'stroke-width':1.4});el('rect',{x:c*40+4,y:r*40+4,width:32,height:32,rx:3,fill:'none',stroke:'#ffffff','stroke-opacity':'.22','stroke-width':1});}
function base(x,y,color){el('rect',{x:x*40,y:y*40,width:240,height:240,rx:20,fill:color,stroke:'#fff4df','stroke-width':4});el('rect',{x:x*40+25,y:y*40+25,width:190,height:190,rx:22,fill:'#faf6eb',stroke:'#ffffff','stroke-width':4});el('rect',{x:x*40+31,y:y*40+31,width:178,height:178,rx:18,fill:'none',stroke:color,'stroke-opacity':'.22','stroke-width':2});}
function centre(){
 el('rect',{x:240,y:240,width:120,height:120,fill:'#f5efe1',stroke:'#d9ccb8','stroke-width':2});
 el('path',{d:'M240 240H360L300 300Z',fill:sideInfo.yellow.color});
 el('path',{d:'M360 240V360L300 300Z',fill:'#5e9bd3'});
 el('path',{d:'M360 360H240L300 300Z',fill:sideInfo.red.color});
 el('path',{d:'M240 360V240L300 300Z',fill:'#47a978'});
 el('circle',{cx:300,cy:300,r:19,fill:'#fff3d2',stroke:'#86684c','stroke-width':2});
 el('circle',{cx:300,cy:300,r:8,fill:'#8b6c53'});
 el('circle',{cx:300,cy:300,r:4,fill:'#fff5df'});
}
function drawBoard(){
 board.replaceChildren();
 el('rect',{x:0,y:0,width:600,height:600,rx:22,fill:'#f7f0e2',stroke:'#90785d','stroke-width':10});
 // Four coloured home zones: green/blue are decorative; red/yellow are the active players.
 base(0,0,'#378a70');base(9,0,sideInfo.yellow.color);base(0,9,sideInfo.red.color);base(9,9,'#5289bc');
 // Four token sockets in each active home.
 for(const side of ['yellow','red'])yard[side].forEach(([r,c])=>{
  const x=c*40+20,y=r*40+20;
  el('circle',{cx:x,cy:y,r:17,fill:'#fffaf0',stroke:sideInfo[side].dark,'stroke-width':3});
  el('circle',{cx:x,cy:y,r:10.5,fill:'#fff',stroke:'#ffffff','stroke-width':1});
 });
 // Main 52-square track.
 path.forEach(([r,c],i)=>{
  let fill='#f6f1e8';
  if(i===0)fill='#f7a3aa';
  if(i===26)fill='#ffe08a';
  if(safe.has(i))fill='#fff8d9';
  rectCell(r,c,fill);
  if(safe.has(i)){
   el('path',{d:'M'+(c*40+20)+' '+(r*40+10)+'l3 7 8 1-6 5 2 8-7-4-7 4 2-8-6-5 8-1Z',fill:'#a88b58',opacity:.7});
  }
 });
 // Coloured home lanes.
 homeLane.red.forEach(([r,c],i)=>rectCell(r,c,i===4?'#e44759':'#f8c9ce'));
 homeLane.yellow.forEach(([r,c],i)=>rectCell(r,c,i===4?'#f4c342':'#ffedbd'));
 centre();
 el('rect',{x:3,y:3,width:594,height:594,rx:19,fill:'none',stroke:'#ffffff','stroke-opacity':'.76','stroke-width':2});
 drawTokens();
}
function getPos(side,idx){
 const t=tokens[side][idx];
 if(t.progress<0)return {x:yard[side][idx][1]*40+20,y:yard[side][idx][0]*40+20,home:true};
 if(t.progress>=57)return {x:300+(idx-1.5)*8,y:300+(side==='red'?12:-12),done:true};
 if(t.progress>=52){const [r,c]=homeLane[side][t.progress-52];return {x:c*40+20,y:r*40+20,lane:true};}
 const p=path[(sideInfo[side].start+t.progress)%52];return {x:p[1]*40+20,y:p[0]*40+20};
}
function drawTokens(){
 const all=[];
 for(const side of ['yellow','red'])tokens[side].forEach((t,i)=>{if(t.progress<57)all.push({side,i,...getPos(side,i)});});
 const groups=new Map();for(const a of all){const k=Math.round(a.x)+','+Math.round(a.y);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(a);}
 for(const list of groups.values())list.forEach((a,j)=>{
  const offsets=list.length>1?[[0,0],[-7,-7],[7,7],[-7,7],[7,-7]]:[[0,0]];
  const [ox,oy]=offsets[j%offsets.length],x=a.x+ox,y=a.y+oy,available=phase==='choose'&&turn==='red'&&legal.includes(a.i)&&a.side==='red';
  const g=el('g',{class:'token'+(available?' available':'')+(selected===a.i&&a.side==='red'?' selected':''),'data-side':a.side,'data-token':a.i});
  el('ellipse',{cx:x,cy:y+5,rx:15,ry:8,fill:'#1c2631',opacity:.28},g);
  el('circle',{cx:x,cy:y,r:15,fill:sideInfo[a.side].color,stroke:'#fff7e8','stroke-width':2.5},g);
  el('circle',{cx:x,cy:y,r:11.5,fill:'none',stroke:sideInfo[a.side].dark,'stroke-width':1.6},g);
  el('ellipse',{cx:x-4,cy:y-5,rx:5,ry:3,fill:sideInfo[a.side].light,opacity:.9},g);
  el('text',{x,y:y+4.5,'text-anchor':'middle',fill:'#241a1a','font-size':12},g).textContent=String(a.i+1);
  if(available){el('circle',{cx:x,cy:y,r:18,fill:'none',stroke:'#fff1a8','stroke-width':2,'stroke-dasharray':'3 3'},g);}
 });
}
function setDiceFace(value){
 diceEl.dataset.value=String(value);
 diceEl.setAttribute('aria-label',value?'Dice shows '+value:'Dice ready to roll');
 const readout=document.getElementById('diceReadout');
 if(readout)readout.textContent=value?'ROLLED '+value:'READY';
}
function setup(){
 if(timer)clearTimeout(timer);timer=0;
 if(diceAnimationTimer)clearInterval(diceAnimationTimer);diceAnimationTimer=0;
 diceEl.classList.remove('rolling');
 tokens={red:Array.from({length:4},()=>({progress:-1})),yellow:Array.from({length:4},()=>({progress:-1}))};
 turn='red';dice=0;legal=[];phase='roll';sixStreak=0;selected=-1;finished=false;lastAction='';
 setDiceFace(0);statusEl.textContent='Your turn. Tap the dice to roll — you need a 6 to bring a token out.';rollBtn.disabled=false;rollBtn.textContent='🎲 ROLL DICE';
 document.getElementById('hint').textContent='Tap ROLL DICE. Then tap one of the glowing tokens.';
 updateHud();drawBoard();
}
function updateHud(){
 document.getElementById('redHome').textContent=tokens.red.filter(t=>t.progress>=57).length+' / 4 home';
 document.getElementById('yellowHome').textContent=tokens.yellow.filter(t=>t.progress>=57).length+' / 4 home';
 document.getElementById('score').textContent=tokens.red.filter(t=>t.progress>=57).length+' – '+tokens.yellow.filter(t=>t.progress>=57).length;
 document.querySelectorAll('.diff').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.level===difficulty)));
}
function legalMoves(side,d){return tokens[side].map((t,i)=>({i,progress:t.progress})).filter(t=>t.progress<57&&((t.progress===-1&&d===6)||(t.progress>=0&&t.progress+d<=57))).map(t=>t.i);}
function globalPath(side,progress){return (sideInfo[side].start+progress)%52;}
function safeLanding(side,progress){return progress>=0&&progress<52&&safe.has(globalPath(side,progress));}
function moveToken(side,i){
 const t=tokens[side][i],old=t.progress;
 if(old===-1)t.progress=0;else t.progress+=dice;
 let capture=false,home=false;
 if(t.progress<52&&!safeLanding(side,t.progress)){
  const sq=globalPath(side,t.progress),enemy=side==='red'?'yellow':'red';
  tokens[enemy].forEach(et=>{if(et.progress>=0&&et.progress<52&&globalPath(enemy,et.progress)===sq){et.progress=-1;capture=true;}});
 }
 if(t.progress===57)home=true;
 lastAction=(side==='red'?'You':'Computer')+' moved token '+(i+1)+(capture?' · captured a token':'')+(home?' · reached home':'');
 if(side==='red')updateHud();else updateHud();
 drawBoard();
 if(tokens[side].every(x=>x.progress>=57)){
  finished=true;phase='over';rollBtn.disabled=true;statusEl.textContent=side==='red'?'🏆 You win! All four red tokens reached home.':'Computer wins. All four yellow tokens reached home.';document.getElementById('hint').textContent=lastAction;return;
 }
 const bonus=dice===6||capture||home;
 if(bonus){
  if(dice===6)sixStreak++;else sixStreak=0;
  if(sixStreak>=3){sixStreak=0;turn=side==='red'?'yellow':'red';phase='roll';dice=0;legal=[];selected=-1;drawBoard();nextTurn('Three sixes in a row — turn forfeited.');return;}
  phase='roll';dice=0;legal=[];selected=-1;
  statusEl.textContent=(side==='red'?'You':'Computer')+' get another turn'+(capture?' after the capture':home?' for reaching home':' after rolling a 6')+'.';
  rollBtn.disabled=side==='yellow';rollBtn.textContent=side==='red'?'🎲 ROLL AGAIN':'Computer rolling…';
  document.getElementById('hint').textContent=lastAction;
  if(side==='yellow')timer=setTimeout(computerRoll,650);
 }else{
  sixStreak=0;turn=side==='red'?'yellow':'red';phase='roll';dice=0;legal=[];selected=-1;nextTurn(lastAction);
 }
}
function nextTurn(note){
 drawBoard();rollBtn.disabled=turn==='yellow';rollBtn.textContent=turn==='red'?'🎲 Roll Dice':'Computer rolling…';
 statusEl.textContent=note|| (turn==='red'?'Your turn. Roll the dice.':'Computer turn.');
 document.getElementById('hint').textContent=lastAction||'Roll a 6 to leave your yard. Exact roll needed to finish.';
 if(turn==='yellow')timer=setTimeout(computerRoll,650);
}
function resolveRoll(side){
 if(phase!=='roll'||turn!==side||finished)return;
 legal=legalMoves(side,dice);
 if(!legal.length){
  statusEl.textContent=(side==='red'?'You':'Computer')+' rolled '+dice+' — no legal move.';
  document.getElementById('hint').textContent='No token can move with this roll. Turn will pass.';
  if(dice===6){sixStreak++;if(sixStreak>=3){sixStreak=0;turn=side==='red'?'yellow':'red';phase='roll';dice=0;legal=[];nextTurn('Three sixes in a row — turn forfeited.');return;}}
  else sixStreak=0;
  timer=setTimeout(()=>{turn=side==='red'?'yellow':'red';dice=0;legal=[];phase='roll';nextTurn();},850);return;
 }
 phase='choose';
 if(side==='red'){
  statusEl.textContent='You rolled '+dice+'. Choose one of the glowing red tokens.';
  rollBtn.textContent='CHOOSE TOKEN';
  document.getElementById('hint').textContent=legal.map(i=>'Token '+(i+1)).join(' · ')+' can move.';
  drawBoard();
 }else{
  statusEl.textContent='Computer rolled '+dice+' — choosing a token…';
  timer=setTimeout(computerChoose,500);
 }
}
function roll(side){
 if(phase!=='roll'||turn!==side||finished)return;
 phase='rolling';rollBtn.disabled=true;rollBtn.textContent=side==='red'?'🎲 ROLLING…':'Computer rolling…';
 diceEl.classList.remove('rolling');void diceEl.offsetWidth;diceEl.classList.add('rolling');
 let ticks=0;const finalValue=1+Math.floor(Math.random()*6);
 diceAnimationTimer=setInterval(()=>{
  ticks++;setDiceFace(ticks>=8?finalValue:1+Math.floor(Math.random()*6));
  if(ticks>=8){
   clearInterval(diceAnimationTimer);diceAnimationTimer=0;diceEl.classList.remove('rolling');
   dice=finalValue;phase='roll';if(side==='red')rollBtn.textContent='CHOOSE TOKEN';
   resolveRoll(side);
  }
 },75);
}
function aiScore(i,side){
 const t=tokens[side][i],newP=t.progress<0?0:t.progress+dice;
 let score=0;
 if(t.progress<0)score=side==='yellow'?16:12;
 else score=newP*1.4;
 if(newP>=57)score+=difficulty==='hard'?1000:400;
 if(newP<52&&!safeLanding(side,newP)){
  const sq=globalPath(side,newP),enemy=side==='red'?'yellow':'red';
  const captures=tokens[enemy].filter(et=>et.progress>=0&&et.progress<52&&globalPath(enemy,et.progress)===sq).length;
  score+=captures*(difficulty==='hard'?220:difficulty==='medium'?130:45);
 }
 if(safeLanding(side,newP))score+=difficulty==='hard'?48:24;
 const opponents=side==='red'?'yellow':'red';
 if(newP>=0&&newP<52){
  const mySq=globalPath(side,newP);
  const threats=tokens[opponents].filter(et=>et.progress>=0&&et.progress<52&&((globalPath(opponents,et.progress)+1)%52===mySq||(globalPath(opponents,et.progress)+2)%52===mySq||(globalPath(opponents,et.progress)+3)%52===mySq));
  if(threats.length)score-=difficulty==='hard'?22:7;
 }
 return score+(Math.random()*.3);
}
function computerChoose(){
 if(turn!=='yellow'||phase!=='choose'||finished)return;
 let chosen;
 if(difficulty==='easy')chosen=legal[Math.floor(Math.random()*legal.length)];
 else chosen=legal.slice().sort((a,b)=>aiScore(b,'yellow')-aiScore(a,'yellow'))[0];
 moveToken('yellow',chosen);
}
function computerRoll(){if(!finished&&turn==='yellow'&&phase==='roll')roll('yellow');}
function handleBoardClick(e){
 const g=e.target.closest('[data-token]');if(!g||turn!=='red'||phase!=='choose')return;
 const side=g.getAttribute('data-side'),i=Number(g.getAttribute('data-token'));
 if(side!=='red'||!legal.includes(i))return;
 moveToken('red',i);
}
board.addEventListener('click',handleBoardClick);
rollBtn.addEventListener('click',()=>roll('red'));
document.getElementById('newBtn').addEventListener('click',setup);
document.querySelectorAll('.diff').forEach(b=>b.addEventListener('click',()=>{difficulty=b.dataset.level;updateHud();statusEl.textContent='Computer difficulty: '+difficulty.toUpperCase()+'.';}));
setup();
})();
</script>
