<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>SiteCraft Admin</title>
  <link rel="stylesheet" href="./admin.css?v=1">
</head>
<body>
  <div class="admin-app">
    <header class="admin-header">
      <div>
        <h1>SiteCraft Admin</h1>
        <p class="muted" id="whereNote">Owner-only dashboard</p>
      </div>
      <nav class="tabs" id="tabs" hidden>
        <button type="button" data-tab="overview" aria-pressed="true">Overview</button>
        <button type="button" data-tab="bots" aria-pressed="false">BotCraft bots</button>
        <button type="button" data-tab="sites" aria-pressed="false">Websites</button>
        <button type="button" class="ghost" id="signOut">Lock</button>
      </nav>
    </header>
    <p class="status" id="status" role="status" hidden></p>

    <section class="card login" id="login">
      <h2>Unlock the dashboard</h2>
      <p class="muted">Enter the admin key (the ADMIN_TOKEN secret of the sitecraft-ai Worker).</p>
      <form id="loginForm">
        <label>Admin key <input type="password" id="adminKey" autocomplete="current-password" required></label>
        <label class="check"><input type="checkbox" id="rememberKey"> Remember on this device</label>
        <details>
          <summary>Server</summary>
          <label>API address <input id="apiBase" type="url"></label>
        </details>
        <button class="btn" type="submit">Unlock</button>
      </form>
    </section>

    <main id="panels" hidden>
      <section id="overview" class="panel">
        <div class="stats" id="stats"></div>
        <div class="card">
          <h2>Bots by business type</h2>
          <div id="types"></div>
        </div>
      </section>

      <section id="bots" class="panel" hidden>
        <form class="toolbar" id="botSearch">
          <input type="search" id="botQuery" placeholder="Search by shop name, type, shop id or public id" aria-label="Search bots">
          <button class="btn" type="submit">Search</button>
        </form>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Shop</th><th>Type</th><th>Status</th><th class="num">Answers</th><th class="num">Items</th><th class="num">Open Qs</th><th class="num">New requests</th><th>Updated</th></tr></thead>
            <tbody id="botRows"></tbody>
          </table>
        </div>
        <button class="btn ghost" type="button" id="moreBots" hidden>Load more</button>
      </section>

      <section id="sites" class="panel" hidden>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Business</th><th>Site id</th><th>Status</th><th class="num">Plan GB</th><th class="num">Used</th><th>Storage expires</th><th class="num">Leads</th><th>Created</th></tr></thead>
            <tbody id="siteRows"></tbody>
          </table>
        </div>
        <p class="muted" id="sitesNote"></p>
        <button class="btn ghost" type="button" id="moreSites" hidden>Load more</button>
      </section>
    </main>

    <dialog class="drawer" id="botDrawer" aria-labelledby="botTitle">
      <div class="drawer-head">
        <h2 id="botTitle"></h2>
        <button class="btn ghost" type="button" id="closeDrawer">Close</button>
      </div>
      <div id="botBody"></div>
    </dialog>
  </div>
  <script type="module" src="./admin.js?v=1"></script>
</body>
</html>
