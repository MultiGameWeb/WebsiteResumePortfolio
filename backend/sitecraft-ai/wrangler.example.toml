name = "sitecraft-ai"
main = "worker.js"
compatibility_date = "2026-10-01"

# After creating these resources in Cloudflare, replace the placeholders:
# [[d1_databases]]
# binding = "DB"
# database_name = "sitecraft"
# database_id = "REPLACE_WITH_D1_DATABASE_ID"

# [[r2_buckets]]
# binding = "MEDIA_BUCKET"
# bucket_name = "sitecraft-media"

[vars]
GEMINI_MODEL = "gemini-2.5-flash"
# Resume AI: calls per day across everyone (default 50). Secrets RESUME_GEMINI_API_KEY and
# AI_TEST_TOKEN are set in Cloudflare, not here.
# RESUME_AI_DAILY_LIMIT = "50"
