name = "sitecraft-ai-test"
main = "../worker.js"
compatibility_date = "2026-10-01"

[[d1_databases]]
binding = "DB"
database_name = "sitecraft-db"
database_id = "00000000-0000-0000-0000-000000000001"

[[d1_databases]]
binding = "BOTCRAFT_DB"
database_name = "botcraft-db"
database_id = "00000000-0000-0000-0000-000000000002"

[vars]
BOTCRAFT_ALLOWED_ORIGINS = "http://127.0.0.1:8765,http://localhost:8765"
HOSTING_SOURCE_BASE = "http://127.0.0.1:8765/"
BOTCRAFT_GEMINI_API_KEY = "test-key-not-real"
ADMIN_TOKEN = "test-admin-token"
BOTCRAFT_FREE_REPLIES = "5"
BOTCRAFT_STUDIO_DAILY_LIMIT = "3"
BOTCRAFT_VISITOR_DAILY_REPLIES = "3"
BOTCRAFT_SHOP_DAILY_REPLIES = "9"
BOTCRAFT_OWNER_AI_UPDATE = "4"
BOTCRAFT_OWNER_AI_SETUP = "2"
