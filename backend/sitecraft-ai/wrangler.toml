name = "sitecraft-ai"
main = "worker.js"
compatibility_date = "2026-10-01"

[[d1_databases]]
binding = "DB"
database_name = "sitecraft-db"
database_id = "4b639752-7dd1-4543-b9e7-9d0f0eb4afe9"

# BotCraft's own database, separate from the website templates' sitecraft-db.
[[d1_databases]]
binding = "BOTCRAFT_DB"
database_name = "botcraft-db"
database_id = "53b8dd82-40ff-424a-bbf1-29a51a1f9cf2"

# Run the Worker in a US region. Gemini rejects requests from some
# Cloudflare locations with "User location is not supported for the API use".
[placement]
region = "gcp:us-central1"

# The placement hint is not guaranteed, so Gemini requests that still get the
# location error are retried through a Durable Object pinned to the US
# (gemini-proxy.js). SQLite-backed, so it works on the Workers Free plan.
[[durable_objects.bindings]]
name = "GEMINI_US_PROXY"
class_name = "GeminiUsProxy"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GeminiUsProxy"]

[vars]
GEMINI_MODEL = "gemini-3.8-flash"
