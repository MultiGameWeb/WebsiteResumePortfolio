name = "sitecraft-ai"
main = "worker.js"
compatibility_date = "2026-10-01"

[[d1_databases]]
binding = "DB"
database_name = "sitecraft-db"
database_id = "4b639752-7dd1-4543-b9e7-9d0f0eb4afe9"

# BotCraft's own database, separate from the website templates' sitecraft-db.
[[d1_databases]]
binding = "BOTCRAFT_DB"
database_name = "botcraft-db"
database_id = "53b8dd82-40ff-424a-bbf1-29a51a1f9cf2"

# Keep the existing Gemini location fallback configured from main.
[placement]
region = "gcp:us-central1"

[[durable_objects.bindings]]
name = "GEMINI_US_PROXY"
class_name = "GeminiUsProxy"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GeminiUsProxy"]

# R2 binding intentionally omitted while the subscription/bucket is pending.
# Text-only D1 hosting tests remain possible; image routes will return a safe
# R2_NOT_CONFIGURED response until MEDIA_BUCKET is added after bucket creation.

[vars]
ENABLE_DEMO_PUBLISH = "false"
GEMINI_MODEL = "gemini-3.8-flash"
